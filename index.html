<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fadly | Data Enthusiast</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;}
html,body{width:100%;height:100%;background:#000;font-family:"Press Start 2P",monospace;overflow:hidden;user-select:none;}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:9997;}

#splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);text-align:center;padding:24px;background:#000;transition:opacity 0.4s ease;}
#splash.fade{opacity:0;pointer-events:none;}
.splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse 50% 35% at 50% 50%,rgba(60,30,10,0.45),transparent 70%);}
.splash-title{font-size:clamp(22px,5.5vw,58px);line-height:1.35;color:#f5e642;position:relative;z-index:1;text-shadow:3px 3px 0 #c0392b,6px 6px 0 #7b1a10,0 0 30px rgba(245,230,66,0.35);letter-spacing:2px;}
.splash-title .sub{display:block;font-size:clamp(9px,2.2vw,20px);color:#ff6b6b;margin-top:8px;text-shadow:2px 2px 0 #7b1a10;}
.splash-hint{font-size:clamp(7px,1.5vw,11px);color:#666;animation:blink 1.2s step-end infinite;position:relative;z-index:1;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.splash-credit{font-size:clamp(5px,1vw,8px);color:#444;position:relative;z-index:1;}

#world{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.5s ease;}
#world.visible{opacity:1;pointer-events:all;}
.room-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;}

.social-bar{display:flex;gap:14px;align-items:center;z-index:50;}
.social-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:6px;cursor:pointer;transition:transform 0.12s,filter 0.12s;text-decoration:none;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);}
.social-btn:hover{transform:scale(1.15) translateY(-2px);filter:brightness(1.25);}
.social-btn img{width:28px;height:28px;display:block;image-rendering:auto;}

.room{position:relative;width:min(480px,90vw);height:min(600px,85vh);overflow:hidden;border:3px solid #222;border-radius:4px;box-shadow:0 0 0 6px #000,0 0 40px rgba(0,0,0,0.9);}
.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}

.obj{position:absolute;cursor:pointer;z-index:10;}
.obj:hover .obj-img{transform:scale(1.2);filter:brightness(1.15) drop-shadow(0 4px 12px rgba(0,0,0,0.8));}
.obj:active .obj-img{transform:scale(1.05);}
.obj-img{display:block;image-rendering:pixelated;transition:transform 0.15s ease,filter 0.15s ease;}
.obj-label{position:absolute;bottom:calc(100%+6px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#f5e642;font-size:5px;padding:3px 8px;border:1px solid #f5e642;border-radius:2px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:100;}
.obj:hover .obj-label{opacity:1;}

.character{position:absolute;z-index:20;width:110px;height:110px;}
.char-shadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:64px;height:12px;background:rgba(0,0,0,0.5);border-radius:50%;}
.char-sprite{display:block;image-rendering:pixelated;width:110px;height:110px;}
#frame2{display:none;position:absolute;top:0;left:0;width:110px;height:110px;}

.dir-arrow{position:absolute;font-size:9px;color:#f5e642;pointer-events:none;z-index:30;transition:opacity 0.6s;animation:floatY 1.8s ease-in-out infinite;text-shadow:1px 1px 0 #c0392b;}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

#welcome-overlay{position:fixed;inset:0;z-index:8500;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
#welcome-overlay.hidden{display:none;}
.welcome-box{background:#111;border:3px solid #f5e642;border-radius:4px;width:min(460px,90vw);padding:clamp(20px,4vw,32px);text-align:center;box-shadow:0 0 40px rgba(245,230,66,0.2),4px 4px 0 #c0392b;animation:popIn 0.22s ease;}
@keyframes popIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}
.welcome-title{font-size:clamp(9px,2vw,14px);color:#f5e642;margin-bottom:18px;line-height:2;text-shadow:2px 2px 0 #c0392b;}
.welcome-text{font-size:clamp(6px,1.3vw,9px);color:#bbb;line-height:2.5;margin-bottom:24px;}
.welcome-text em{color:#f5e642;font-style:normal;}
.welcome-ok{font-family:"Press Start 2P",monospace;font-size:clamp(7px,1.4vw,10px);background:#f5e642;color:#000;border:none;padding:10px 28px;cursor:pointer;border-radius:2px;border-bottom:4px solid #c0a000;transition:filter 0.1s,transform 0.1s;}
.welcome-ok:hover{filter:brightness(1.1);}
.welcome-ok:active{transform:translateY(2px);border-bottom-width:2px;}

#dialog-overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(1px);}
#dialog-overlay.open{display:flex;}
.dialog-wrap{width:100%;max-width:720px;position:relative;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.dialog-portrait{position:absolute;bottom:100%;left:16px;width:clamp(90px,16vw,150px);height:clamp(90px,16vw,150px);image-rendering:pixelated;border:3px solid #f5e642;border-bottom:none;background:#111;display:block;}
.dialog-name{position:absolute;bottom:100%;left:clamp(106px,18vw,170px);background:#111;color:#f5e642;font-size:clamp(7px,1.3vw,10px);padding:5px 14px 4px;border:2px solid #f5e642;border-bottom:none;border-radius:4px 4px 0 0;}
.dialog-box{background:#0a0a0a;border:3px solid #f5e642;padding:clamp(12px,2.5vw,20px) clamp(12px,2.5vw,20px) clamp(14px,2.5vw,20px);min-height:110px;}
.dialog-text{font-size:clamp(7px,1.4vw,10px);color:#ccc;line-height:2.2;margin-bottom:clamp(12px,2vw,18px);}
.dialog-text::after{content:"▌";color:#f5e642;animation:blink 0.8s step-end infinite;margin-left:2px;}
.dialog-text.done::after{display:none;}
.dialog-btns{display:flex;justify-content:flex-end;gap:10px;}
.dialog-btn{font-family:"Press Start 2P",monospace;font-size:clamp(6px,1.1vw,9px);padding:8px 18px;border:2px solid;border-radius:2px;cursor:pointer;transition:filter 0.1s,transform 0.1s;border-bottom-width:3px;}
.dialog-btn:active{transform:translateY(2px);border-bottom-width:1px;}
.btn-ok{background:#f5e642;color:#000;border-color:#c0a000;border-bottom-color:#806800;}
.btn-ok:hover{filter:brightness(1.1);}
.btn-cancel{background:#1a1a1a;color:#666;border-color:#333;border-bottom-color:#111;}
.btn-cancel:hover{filter:brightness(1.4);}

/* CONTENT MODAL */
#content-overlay{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
#content-overlay.open{display:flex;}
.content-modal{background:#f0ede8;border:3px solid #999;border-radius:2px;width:min(580px,92vw);max-height:84vh;display:flex;flex-direction:column;animation:popIn 0.18s ease;overflow:hidden;box-shadow:4px 4px 0 rgba(0,0,0,0.5);}
.content-titlebar{background:#c8c0d8;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #aaa;flex-shrink:0;}
.content-titlebar-title{font-size:clamp(6px,1.1vw,9px);color:#1a0e30;display:flex;align-items:center;gap:8px;}
.content-titlebar-btns{display:flex;gap:4px;}
.titlebar-btn{width:14px;height:14px;border:1px solid #888;background:#d0c8e0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;color:#333;}
.titlebar-btn.close-btn:hover{background:#c04040;color:#fff;}
.content-topnav{display:flex;justify-content:center;gap:6px;padding:8px;background:#d8d0e8;border-bottom:2px solid #aaa;flex-shrink:0;}
.cnav-btn{width:36px;height:32px;background:#555;border:2px solid #777;border-bottom:3px solid #333;border-radius:3px 3px 1px 1px;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0.5;}
.content-body{flex:1;overflow-y:auto;background:#f0ede8;}
.content-body::-webkit-scrollbar{width:12px;}
.content-body::-webkit-scrollbar-track{background:#d0c8e0;}
.content-body::-webkit-scrollbar-thumb{background:#8878b0;border:2px solid #d0c8e0;}
.content-layout{display:flex;}
.bookmarks{width:16px;background:#d0c8e0;border-right:2px solid #aaa;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:28px;flex-shrink:0;}
.bookmark{width:10px;height:10px;background:#3a2a5a;}

/* paper content styles */
.content-inner{flex:1;padding:clamp(16px,3vw,28px) clamp(16px,3vw,24px);}
.c-name{font-size:clamp(11px,2.2vw,16px);color:#1a0e30;margin-bottom:5px;border-bottom:2px solid #b0a0c8;padding-bottom:8px;}
.c-subtitle{font-size:clamp(6px,1.1vw,9px);color:#5a4a7a;margin-bottom:16px;font-style:italic;}
.c-section-title{font-size:clamp(7px,1.3vw,10px);color:#1a0e30;border-bottom:1px solid #c0b0d8;padding-bottom:4px;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.c-section-title::after{content:"";flex:1;height:1px;background:linear-gradient(to right,#c0b0d8,transparent);}
.c-paragraph{font-size:clamp(5.5px,0.95vw,7.5px);color:#2a1e3a;line-height:2.5;margin-bottom:8px;}
.c-job-block{position:relative;padding-left:12px;margin-bottom:14px;}
.c-accent-line{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,#7a5aaa,#3a2a5a);border-radius:2px;}
.c-job-title{font-size:clamp(6.5px,1.1vw,9px);color:#1a0e30;margin-bottom:3px;}
.c-job-company{font-size:clamp(5px,0.85vw,7px);color:#7a5a9a;margin-bottom:6px;font-style:italic;}
.c-chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.c-chip{font-size:clamp(4px,0.7vw,6px);padding:3px 8px;border-radius:2px;background:#2a1e4a;color:#c8b4f0;border:1px solid #4a3a6a;font-family:"Press Start 2P",monospace;}
.c-chip.chip-g{background:#0a2a14;color:#86efac;border-color:#14532d;}
.c-chip.chip-b{background:#0c1e3d;color:#93c5fd;border-color:#1e3a8a;}
.c-chip.chip-p{background:#1e0a3d;color:#d8b4fe;border-color:#3b0764;}
.c-chip.chip-a{background:#1c1000;color:#fcd34d;border-color:#451a03;}
</style>
</head>

  document.getElementById("welcome-overlay").classList.add("hidden");

  else{f2.style.display="none";f1.style.display="block";}
  showF1=!showF1;
}
function idleLoop(){
  setTimeout(()=>{swapFrame();setTimeout(()=>{swapFrame();idleLoop();},1000);},3000+Math.random()*2000);
}

let currentKey=null;
function typeText(el,text,speed=40){
  el.classList.remove("done");el.textContent="";let i=0;
  const t=setInterval(()=>{if(i<text.length){el.textContent+=text[i];i++;}else{clearInterval(t);el.classList.add("done");}},speed);
}
function triggerDialog(key){
  currentKey=key;
  document.getElementById("dlg-ok").textContent=dialogData[key].ok;
  document.getElementById("dialog-overlay").classList.add("open");
  const txt=document.getElementById("dlg-text");
  txt.classList.remove("done");txt.textContent="";
  setTimeout(()=>typeText(txt,dialogData[key].text),80);
}
function closeDialog(){document.getElementById("dialog-overlay").classList.remove("open");}
function confirmDialog(){closeDialog();openContent(currentKey);}
function openContent(key){
  const c=contentData[key];
  document.getElementById("ct-icon").textContent=c.icon;
  document.getElementById("ct-title").textContent=c.title;
  document.getElementById("ct-body").innerHTML=c.html;
  document.getElementById("content-overlay").classList.add("open");
}
function closeContent(){document.getElementById("content-overlay").classList.remove("open");}
function closeContentOut(e){if(e.target===document.getElementById("content-overlay"))closeContent();}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(document.getElementById("content-overlay").classList.contains("open"))closeContent();
    else closeDialog();
  }
});
</script>
